inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'vendor/**/*'
    - 'bin/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

# Relax metrics for test files and generators
Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
    - 'db/migrate/**/*'
    - 'lib/recording_studio_billing/hooks.rb'

Metrics/ModuleLength:
  Exclude:
    - 'lib/recording_studio_billing/billing_admin_forms.rb'
    - 'lib/recording_studio_billing/billing_operations_section.rb'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'db/migrate/**/*'
    - 'lib/generators/**/*'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'db/migrate/**/*'
    - 'lib/generators/**/*'

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_billing/billing_operations_section.rb'

# Allow empty blocks in tests (common for stubs/mocks)
Lint/EmptyBlock:
  Exclude:
    - 'test/**/*'

# Allow nested method definitions in tests (common for testing behavior)
Lint/NestedMethodDefinition:
  Exclude:
    - 'test/**/*'

# Allow underscores in test method names (test_something_100 is fine)
Naming/VariableNumber:
  Exclude:
    - 'test/**/*'

# Don't require super in service initialize methods
Lint/MissingSuper:
  Exclude:
    - 'lib/recording_studio_billing/services/**/*'
    - 'test/services/**/*'
